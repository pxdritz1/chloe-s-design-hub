name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: fetch PhotoCraft WebAssembly release and its missing snippets
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/storytold/photocraft/releases/latest)"
          tag_name="$(jq -r '.tag_name' <<< "$release_json")"
          asset_url="$(jq -r '.assets[] | select(.name | startswith("photocraft-web-") and endswith(".zip")) | .browser_download_url' <<< "$release_json" | head -n 1)"
          test -n "$tag_name"
          test -n "$asset_url"

          mkdir -p /tmp/photocraft public/photocraft
          curl -fL "$asset_url" -o /tmp/photocraft-web.zip
          unzip -q /tmp/photocraft-web.zip -d /tmp/photocraft
          app_dir="$(find /tmp/photocraft -name index.html -printf '%h\n' -quit)"
          test -n "$app_dir"
          cp -a "$app_dir"/. public/photocraft/

          # The upstream release ZIP omits wasm-bindgen's generated eframe snippets.
          # Build the matching app tag to restore those files without rebuilding its WASM.
          git clone --depth 1 --branch "$tag_name" https://github.com/storytold/photocraft.git /tmp/photocraft-source
          cargo install trunk --locked
          (cd /tmp/photocraft-source/apps/photocraft-web && trunk build --release)
          snippets_dir="/tmp/photocraft-source/dist/web/snippets"
          test -d "$snippets_dir"
          mkdir -p public/photocraft/app/snippets
          cp -a "$snippets_dir"/. public/photocraft/app/snippets/
          test -n "$(find public/photocraft/app/snippets -type f -name 'inline0.js' -print -quit)"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("public/photocraft")
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".js", ".css", ".json", ".webmanifest"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              content = re.sub(r'(["\'(=])/(assets|static|wasm)/', r'\1./\2/', content)
              content = content.replace('<base href="/">', '<base href="./">')
              path.write_text(content, encoding="utf-8")
          PY
          test -s public/photocraft/index.html
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
