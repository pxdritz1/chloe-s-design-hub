name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: fetch PhotoCraft WebAssembly release
        run: |
          set -euo pipefail
          asset_url="$(curl -fsSL https://api.github.com/repos/storytold/photocraft/releases/latest | jq -r '.assets[] | select(.name | startswith("photocraft-web-") and endswith(".zip")) | .browser_download_url' | head -n 1)"
          test -n "$asset_url"
          mkdir -p /tmp/photocraft public/photocraft
          curl -fL "$asset_url" -o /tmp/photocraft-web.zip
          unzip -q /tmp/photocraft-web.zip -d /tmp/photocraft
          app_dir="$(find /tmp/photocraft -name index.html -printf '%h\n' -quit)"
          test -n "$app_dir"
          cp -a "$app_dir"/. public/photocraft/
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
