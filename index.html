<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191e1a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="a calm, local-first collection of creative tools for color, image, vector and type." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="chloe's design hub" />
    <meta property="og:description" content="a calm, local-first collection of creative tools for color, image, vector and type." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("chloe-design-hub-preferences") || "{}");
          var theme = (stored.state && stored.state.theme) || "system";
          var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <title>chloe's design hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
